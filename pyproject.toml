[project]
name = "line-bot"
version = "0.1.0"
description = "LINE echo bot (FastAPI + line-bot-sdk v3, uv-managed)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "line-bot-sdk>=3.25.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
